spring.application.name=poultry-management

# Server port (defaults to 8080, supports PORT on cloud platforms like Render)
server.port=${PORT:8080}

# MySQL Database (supports cloud database URLs via environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/poultry_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ROOT}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:my-super-secret-key-for-poultry-management-system-2026}
jwt.expiration=86400000